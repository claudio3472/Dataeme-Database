<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Carrinho</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        .pedido {
            display: flex;
            flex-direction: column;
            margin-top: 40px;
            margin-bottom: 20px;
            padding: 15px 20px;
            border-radius: 10px;
            font-size: 20px;
            font-weight: bold;
            gap: 30px;
            padding: 10px;
            
        }

        .linha {
            box-shadow: 0 3px 10px rgba(68, 67, 67, 0.08);
            padding: 5px;

        }

        .botao_preco {
            display: flex;
            flex-direction: row;
            align-items: center;
        }
        
        form {
            display: inline;
            margin-left: 20px;

        }

    </style>
</head>

<body>

    <header>

        <h1>Carrinho</h1>

        <nav>

            <a href="/catalogo">
                Catálogo
            </a>

            <a href="/perfil">
                Perfil
            </a>
     
            <a href="/admin">
                Admin
            </a>

            <a href="/logout">
                Logout
            </a>

        </nav>

    </header>

    <div class="container">

        <div class="card">  

            <div class="pedido"> 
                <!-- Nome | Cor | Qnt. | Prc. Uni. | Prc. Total -->
                {% for l in linha %}
                    
                        <div class="linha">
                            {{ l.nome }}
                            {{ l.cor }}
                            {{ l.quantidade }}
                            {{ l.preco_unitario }}€
                            {{ l.valor_linha }}€

                            <form class="form-horizontal" method="POST">

                                <input
                                    type="hidden"
                                    name="id_linha"
                                    value="{{ l.id }}"
                                >
                                <button type="submit">
                                    Eliminar linha
                                </button>
                            </form>
                            
                        </div>
                        
                {% endfor %}
                
                <div class="botao_preco">
                    <strong>Valor Total: {{ valor_total }}€</strong>

                    <form class="form-horizontal" method="POST" action="/carrinhofinalizar">

                        <button type="submit">
                            Finalizar Pedido
                        </button>
                    
                    </form>
                </div>

            </div>

        </div>

    </div>


</body>
</html>
