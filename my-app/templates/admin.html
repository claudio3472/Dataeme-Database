<!DOCTYPE html>

<html lang="pt">

<head>


<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>DataEme - Dashboard</title>

<link
    rel="stylesheet"
    href="{{ url_for('static', filename='css/style.css') }}"
>

</head>

<body>

<header>

    <h1>Dashboard</h1>

    <nav>

        <a href="/logout">
            Logout
        </a>

    </nav>

</header>


<div class="dashboard">


    <!-- CLIENTES -->

    <a
        href="{{ url_for('clientes_admin') }}"
        class="dashboard-card"
    >

        <div class="dashboard-icon">
            👥
        </div>

        <h2>
            Clientes
        </h2>

        <p>
            Consultar e editar informações dos clientes.
        </p>

    </a>


    <!-- PRODUTOS -->

    <a
        href="{{ url_for('produtos_admin') }}"
        class="dashboard-card"
    >

        <div class="dashboard-icon">
            📦
        </div>

        <h2>
            Produtos
        </h2>

        <p>
            Consultar e editar os produtos do catálogo.
        </p>

    </a>


    <!-- PEDIDOS -->

    <a
        href="{{ url_for('pedidos_admin') }}"
        class="dashboard-card"
    >

        <div class="dashboard-icon">
            🛒
        </div>

        <h2>
            Pedidos
        </h2>

        <p>
            Consultar e gerir os pedidos dos clientes.
        </p>

    </a>


    <!-- OUTRAS OPÇÕES -->

    <a
        href="{{ url_for('configuracoes_admin') }}"
        class="dashboard-card"
    >

        <div class="dashboard-icon">
            ⚙️
        </div>

        <h2>
            Configurações
        </h2>

        <p>
            Gerir configurações da aplicação.
        </p>

    </a>


</div>


</body>

</html>
