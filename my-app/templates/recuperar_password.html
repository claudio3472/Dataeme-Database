<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Recuperar Password</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <!-- =========================
         HEADER
         ========================= -->

    <header>

        <h1>
            Recuperar password
        </h1>

    </header>

    <p>
        Introduza o email associado à sua conta.
    </p>

    {% if erro %}
    <p style="color:red;">
        {{ erro }}
    </p>
    {% endif %}

    {% if sucesso %}
    <p style="color:green;">
        {{ sucesso }}
    </p>
    {% endif %}

    <form method="POST">

        <label for="email">
            Email
        </label>

        <br>

        <input
            type="email"
            id="email"
            name="email"
            placeholder="exemplo@email.com"
            required
        >

        <br><br>

        <button type="submit">
            Enviar código
        </button>

    </form>

    <br>

    <a href="/login">
        Voltar ao login
    </a>

</body>
</html>
