<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#dce7ea">

    <title>DataEme — Recuperar acesso</title>

    <style>
        :root {
            --rp-teal: #0e7c86;
            --rp-teal-dark: #095f68;
            --rp-teal-soft: #e7f4f4;
            --rp-ink: #182b3a;
            --rp-muted: #647481;
            --rp-border: #dce5e8;
            --rp-bg: #dce7ea;
            --rp-danger: #9f2828;
            --rp-danger-bg: #fff3f2;
            --rp-success: #166534;
            --rp-success-bg: #f0fdf4;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            margin: 0;
            padding: 28px 16px;
            color: var(--rp-ink);
            background:
                radial-gradient(800px 560px at 0% 0%, rgba(31, 181, 181, 0.30) 0%, transparent 66%),
                radial-gradient(760px 540px at 100% 100%, rgba(30, 136, 229, 0.24) 0%, transparent 66%),
                radial-gradient(560px 400px at 0% 100%, rgba(164, 196, 0, 0.20) 0%, transparent 65%),
                radial-gradient(520px 380px at 100% 0%, rgba(30, 136, 229, 0.12) 0%, transparent 65%),
                var(--rp-bg);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
        }

        .rp-card {
            width: min(100%, 460px);
            padding: 38px 36px 30px;
            background: #fff;
            border: 1px solid rgba(255, 255, 255, 0.9);
            border-radius: 24px;
            box-shadow:
                0 2px 6px rgba(24, 43, 58, 0.06),
                0 26px 70px rgba(13, 60, 140, 0.22);
            animation: rp-enter 420ms ease-out both;
        }

        @keyframes rp-enter {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .rp-brand {
            margin: 0 0 28px;
            color: var(--rp-teal);
            font-size: 0.82rem;
            font-weight: 750;
            letter-spacing: 0.16em;
            text-align: center;
            text-transform: uppercase;
        }

        .rp-icon {
            width: 68px;
            height: 68px;
            display: grid;
            place-items: center;
            margin: 0 auto 20px;
            color: var(--rp-teal);
            background: var(--rp-teal-soft);
            border: 1px solid #d3eaea;
            border-radius: 20px;
        }

        .rp-icon svg {
            width: 31px;
            height: 31px;
        }

        h1 {
            margin: 0;
            color: var(--rp-ink);
            font-size: clamp(1.55rem, 5vw, 1.85rem);
            font-weight: 720;
            letter-spacing: -0.035em;
            line-height: 1.2;
            text-align: center;
        }

        .rp-intro {
            max-width: 350px;
            margin: 12px auto 26px;
            color: var(--rp-muted);
            font-size: 0.97rem;
            line-height: 1.6;
            text-align: center;
        }

        .rp-alert {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin: 0 0 20px;
            padding: 13px 14px;
            border: 1px solid;
            border-radius: 13px;
            font-size: 0.9rem;
            line-height: 1.45;
        }

        .rp-alert svg {
            width: 18px;
            height: 18px;
            flex: none;
            margin-top: 1px;
        }

        .rp-alert-error {
            color: var(--rp-danger);
            background: var(--rp-danger-bg);
            border-color: #f4c8c4;
        }

        .rp-alert-success {
            color: var(--rp-success);
            background: var(--rp-success-bg);
            border-color: #b8e4c5;
        }

        .rp-field {
            margin-bottom: 18px;
        }

        .rp-field label {
            display: block;
            margin-bottom: 8px;
            color: var(--rp-ink);
            font-size: 0.9rem;
            font-weight: 650;
        }

        .rp-input-wrap {
            position: relative;
        }

        .rp-input-wrap svg {
            position: absolute;
            top: 50%;
            left: 14px;
            width: 19px;
            height: 19px;
            color: #81919b;
            pointer-events: none;
            transform: translateY(-50%);
        }

        .rp-input-wrap input {
            width: 100%;
            height: 52px;
            padding: 0 15px 0 44px;
            color: var(--rp-ink);
            background: #fff;
            border: 1.5px solid var(--rp-border);
            border-radius: 13px;
            outline: none;
            font: inherit;
            font-size: 0.97rem;
            transition: border-color 150ms ease, box-shadow 150ms ease;
        }

        .rp-input-wrap input::placeholder {
            color: #98a5ad;
        }

        .rp-input-wrap input:hover {
            border-color: #b7c8ce;
        }

        .rp-input-wrap input:focus {
            border-color: var(--rp-teal);
            box-shadow: 0 0 0 4px rgba(14, 124, 134, 0.13);
        }

        .rp-submit {
            width: 100%;
            min-height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px 18px;
            color: #fff;
            background: linear-gradient(
                105deg,
                #0D3C8C 0%,
                #1565C0 34%,
                #0E7C86 68%,
                #598046 100%
            );
            border: 0;
            border-radius: 12px;
            box-shadow:
                inset 0 0 0 1px rgba(255, 255, 255, 0.12),
                0 8px 18px rgba(21, 101, 192, 0.20);
            cursor: pointer;
            font: inherit;
            font-size: 0.96rem;
            font-weight: 680;
            transition: box-shadow 150ms ease, filter 150ms ease, transform 100ms ease;
        }

        .rp-submit:hover {
            transform: translateY(-1px);
            box-shadow:
                inset 0 0 0 1px rgba(255, 255, 255, 0.16),
                0 11px 22px rgba(21, 101, 192, 0.26);
        }

        .rp-submit:active {
            transform: translateY(1px);
        }

        .rp-submit:focus-visible {
            outline: 3px solid rgba(127, 175, 0, 0.38);
            outline-offset: 3px;
        }

        .rp-back:focus-visible {
            outline: 3px solid rgba(14, 124, 134, 0.28);
            outline-offset: 3px;
        }

        .rp-submit svg {
            width: 18px;
            height: 18px;
        }

        .rp-note {
            display: flex;
            align-items: flex-start;
            gap: 9px;
            margin: 20px 0 0;
            padding: 13px 14px;
            color: var(--rp-muted);
            background: #f7f9fa;
            border: 1px solid #edf1f2;
            border-radius: 12px;
            font-size: 0.82rem;
            line-height: 1.45;
        }

        .rp-note svg {
            width: 17px;
            height: 17px;
            flex: none;
            margin-top: 1px;
            color: var(--rp-teal);
        }

        .rp-back {
            display: block;
            width: fit-content;
            margin: 24px auto 0;
            color: var(--rp-teal-dark);
            font-size: 0.9rem;
            font-weight: 650;
            text-align: center;
            text-decoration: none;
        }

        .rp-back:hover {
            text-decoration: underline;
            text-underline-offset: 3px;
        }

        @media (max-width: 480px) {
            body {
                padding: 18px 14px;
            }

            .rp-card {
                padding: 30px 22px 24px;
                border-radius: 20px;
            }

            .rp-brand {
                margin-bottom: 23px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>
    <main class="rp-card">
        <p class="rp-brand">DataEme</p>

        <div class="rp-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="5" width="18" height="14" rx="2.5"/>
                <path d="m4 7 8 6 8-6"/>
            </svg>
        </div>

        <h1>Recuperar acesso</h1>
        <p class="rp-intro">
            Introduza o email associado à sua conta. Enviaremos um código
            para poder definir uma nova password.
        </p>

        {% if erro %}
        <div class="rp-alert rp-alert-error" role="alert">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="9"/>
                <path d="M12 8v5"/>
                <circle cx="12" cy="16.5" r="0.6" fill="currentColor"/>
            </svg>
            <span>{{ erro }}</span>
        </div>
        {% endif %}

        {% if sucesso %}
        <div class="rp-alert rp-alert-success" role="status" aria-live="polite">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="9"/>
                <path d="m8 12 2.5 2.5L16 9"/>
            </svg>
            <span>{{ sucesso }}</span>
        </div>
        {% endif %}

        <form method="POST" action="{{ url_for('recuperar_password') }}">
            <div class="rp-field">
                <label for="email">Email associado à conta</label>
                <div class="rp-input-wrap">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <rect x="3" y="5" width="18" height="14" rx="2.5"/>
                        <path d="m4 7 8 6 8-6"/>
                    </svg>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="nome@exemplo.pt"
                        autocomplete="email"
                        inputmode="email"
                        required
                    >
                </div>
            </div>

            <button class="rp-submit" type="submit">
                Enviar código
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M5 12h14"/>
                    <path d="m13 6 6 6-6 6"/>
                </svg>
            </button>
        </form>

        <p class="rp-note">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="4" y="10" width="16" height="11" rx="2"/>
                <path d="M8 10V7a4 4 0 0 1 8 0v3"/>
            </svg>
            <span>Por segurança, nunca enviamos a sua password por email.</span>
        </p>

        <a class="rp-back" href="{{ url_for('login') }}">Voltar ao login</a>
    </main>
</body>
</html>
