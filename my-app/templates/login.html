{% extends "layout.html" %}

{% block content %}

<h2>Login</h2>

{% if erro %}
<p style="color:red;">
    {{ erro }}
</p>
{% endif %}

<form method="POST">

    <input
        type="text"
        name="username"
        placeholder="NIF"
        required
    >

    <br><br>

    <input
        type="password"
        name="password"
        placeholder="Password"
        required
    >

    <br><br>

    <button type="submit">
        Entrar
    </button>

</form>

<br>

<a href="/recuperar-password">
    Esqueci-me da password
</a>

{% endblock %}
