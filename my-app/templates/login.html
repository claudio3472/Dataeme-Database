<!DOCTYPE html>
<html lang="pt">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Log in</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            color: #333;
        }

        /* HEADER */

        header {
            background: white;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .1);
        }

        header h1 {
            color: #2f6fed;
        }

        form p {
            padding: 20px;
            box-shadow: 0 3px 10px rgba(68, 67, 67, 0.08);
        }
            
        form button {
            margin-left: 20px;
            padding: 10px;
            font-size: 15px;
        }

        .loginContainer {
            display: flex;
            flex-direction: column;
            padding: 50px;
            background-color: white;
            width: 300px;
            margin-left: 40%;
            margin-right: 40%;
            justify-content: center;
            align-items: center;
            margin-top: 40px;
            border-radius: 15px;
            box-shadow: 0 3px 10px rgba(9, 9, 9, 0.08);
        }

        .loginContainer a {
            font-size: 10px;
            margin-left: 52px;
        }

        .loginContainer button {
            margin-left: 43px;
            padding: 15px
        }

        .loginContainer p {
            background-color: none;
            font-size: 12px;
        }

    </style>

</head>


<body>

    <header>

        <h1>Login</h1>

    </header>

    
    <div class="loginContainer">

        <h2>Iniciar Sessão</h2>

        <br>
        {% if erro %}
        <p style="color:red;">
            {{ erro }}
        </p>
        {% endif %}

        <form method="POST">

            <input
                type="text"
                name="username"
                placeholder="NIF/User"
                required
            >

            <br><br>

            <input
                type="password"
                name="password"
                placeholder="Password"
                required
            >

            <br>

                <a href="/recuperar-password">
                    Esqueci-me da password
                </a>

            <br><br>

            <button type="submit">
                Entrar
            </button>

            <br>

            
        </form>


    </div>

    

</body>
