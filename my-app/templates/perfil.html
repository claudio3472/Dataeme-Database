{% extends "layout.html"%}
{% block content %}

    <div class="container">
        
        <div class="card">

            <form method="POST" class="formperfil">

                <p>
                    <strong>Nome:</strong>
                    <input
                        type="text"
                        name="nome"
                        value="{{ cliente.nome }}"
                        required
                    >
                </p>

                <p>
                    <strong>NIF:</strong>
                    <input
                        type="text"
                        name="nif"
                        value="{{ cliente.nif }}"
                        required
                    >
                </p>

                <p>
                    <strong>Email:</strong>
                    <input
                        type="email"
                        name="email"
                        value="{{ cliente.email }}"
                        required
                    >
                </p>

                <p>
                    <strong>Telefone:</strong>

                    <input
                        type="text"
                        name="ind"
                        value="{{ cliente.indicativo }}"
                        required
                        style="width: 60px;"
                    >

                    <input
                        type="tel"
                        name="tel"
                        value="{{ cliente.tel }}"
                        required
                    >
                </p>

                <p>
                    <strong>Código Postal:</strong>

                    <input
                        type="text"
                        name="postal"
                        value="{{ cliente.postal }}"
                        required
                        style="width: 90px;"
                    >

                    <input
                        type="text"
                        name="local"
                        value="{{ cliente.local }}"
                        required
                    >
                </p>

                <p>
                    <strong>Morada:</strong>

                    <input
                        type="text"
                        name="morada"
                        value="{{ cliente.morada }}"
                        required
                    >
                </p>

                <p>
                    <strong>Nº Prédio:</strong>

                    <input
                        type="number"
                        name="predio"
                        value="{{ cliente.predio }}"
                    >   
                </p>

                <p>
                    <strong>Andar:</strong>

                    <input
                        type="text"
                        name="andar"
                        value="{{ cliente.andar }}"
                    >
                </p>

                <br>

                <div class="submitContainer">

                    <button class="animacao-botao" type="submit">
                        Salvar Alterações
                    </button>
                    
                    {% if sucesso %}
                    <div style="color: green; margin-bottom: 15px; font-weight: bold;">
                        {{ sucesso }}
                    </div>
                    {% endif %}

                    {% if erro %}
                    <div style="color: red; margin-bottom: 15px; font-weight: bold;">
                        {{ erro }}
                    </div>
                    {% endif %}

                </div>

            </form>

        </div>

    </div>

{% endblock %}
