<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Registar</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 40px auto;
        }

        h1 {
            margin-bottom: 25px;
        }

        .erro {
            color: red;
            margin-bottom: 20px;
        }

        .campo {
            margin-bottom: 10px;
        }

        .campo label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }

        input {
            width: 100%;
            height: 38px;
            box-sizing: border-box;
            padding: 0 10px;
        }

        .linha {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
        }

        .pequeno {
            width: 140px;
        }

        .medio {
            width: 180px;
        }

        .morada {
            width: 500px;
            font-weight: bold;
        }

        .moradacampos {
            width: 20px;
        }

        .grande {
            flex: 1;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
        }

        .ajuda {
            font-size: 12px;
            color: #666;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>

<h1>Criar Conta</h1>

{% if erro %}
<p class="erro">
    {{ erro }}
</p>
{% endif %}

<form method="POST">

    <div class="campo">
        <label>NIF</label>
        <input
            type="text"
            name="nif"
            required
            pattern="\d{9}"
            title="O NIF deve conter exatamente 9 dígitos."
        >
    </div>

    <div class="campo">
        <label>Nome</label>
        <input
            type="text"
            name="nome"
            required
        >
    </div>

    <div class="campo">
        <label>Email</label>
        <input
            type="email"
            name="email"
            required
        >
    </div>

    <div class="linha">

        <div class="pequeno">
            <div class="ajuda">
                Indicativo
            </div>
            <input
                type="text"
                name="ind"
                placeholder="+351"
                required
                pattern="\+\d{1,4}"
                title="Exemplo: +351"
            >
        </div>

        <div class="grande">
            <div class="ajuda">
                Telefone
            </div>
            <input
                type="text"
                name="tel"
                required
                pattern="\d{6,15}"
                title="O telefone deve conter entre 6 e 15 dígitos."
            >
        </div>

    </div>
    
    <div class="linha"> 

        <div class="morada">
            <label>Morada</label>
            <input
                type="text"
                name="morada"
                required
            >
        </div>

        <div class="moradacampo">
            <label class="ajuda">Nº Prédio</label>
            <input
                type="number"
                name="predio"
                required
            >
        </div>

        <div class="moradacampo">
            <label class="ajuda">Andar</label>
            <input
                type="text"
                name="andar"
                pattern="[0-9].+"               
            >
        </div>

    </div>

    <div class="linha">

        <div class="medio">
            <div class="ajuda">
                Código Postal
            </div>
            <input
                type="text"
                name="postal"
                required
                pattern="\d{4}-\d{3}"
                placeholder="0000-000"
                title="Formato: 0000-000"
            >
        </div>

        <div class="grande">
            <div class="ajuda">
                Localização
            </div>
            <input
                type="text"
                name="local"
                placeholder="Localidade"
                required
            >
        </div>

    </div>

    <div class="campo">
        <label>Password</label>
        <input
            type="password"
            name="password"
            required
            minlength="8"
        >
    </div>

        <div class="campo">
        <label>Confirmar Password</label>
        <input
            type="password"
            name="confirmar_password"
            required
            minlength="8"
        >
    </div>


    <button type="submit">
        Criar Conta
    </button>

</form>

<p>
    Já tem conta?
    <a href="/login">
        Login
    </a>
</p>

</body>
</html>
