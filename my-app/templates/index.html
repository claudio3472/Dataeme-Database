<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dataeme</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        header {
            background: #4472C4;
            color: white;
            padding: 20px 40px;
        }

        .logo {
            font-size: 32px;
            font-weight: bold;
        }

        .hero {
            text-align: center;
            padding: 100px 20px;
        }

        .hero h1 {
            font-size: 60px;
            margin-bottom: 20px;
        }

        .hero p {
            font-size: 22px;
            color: #555;
            margin-bottom: 50px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .btn {
            background: #4472C4;
            color: white;
            text-decoration: none;
            padding: 15px 30px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            transition: 0.2s;
        }

        .btn:hover {
            background: #2f5ca8;
        }

        .cards {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 25px;
            margin: 50px;
        }

        .card {
            width: 300px;
            background: white;
            padding: 25px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 2px 10px rgba(0, 0, 0, .1);
        }

        .card h3 {
            margin-bottom: 10px;
        }
    </style>
</head>

<body>

    <header>
        <div class="logo">Dataeme</div>
    </header>

    <section class="hero">

        <h1>Catálogo Digital Dataeme</h1>

        <p>
            Plataforma de material de escritório e
            informática.
        </p>

        <div class="buttons">

            <a href="/login" class="btn">
                Login
            </a>

            <a href="/registar" class="btn">
                Registar
            </a>

        </div>

    </section>

    <section class="cards">

        <div class="card">
            <h3>Equipamentos de Escritório</h3>
            <p>
                Encadernadoras, plastificadoras,
                calculadoras e acessórios.
            </p>
        </div>

        <div class="card">
            <h3>Informática</h3>
            <p>
                Impressoras, monitores,
                teclados e periféricos.
            </p>
        </div>

    </section>

</body>
</html>
